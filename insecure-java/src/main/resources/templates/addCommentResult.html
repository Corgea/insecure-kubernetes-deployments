<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(title='Add Comment Result')}">
    <title>Add Comment Result</title>
</head>
<body>
    <header th:replace="~{fragments :: header(active='addComment')}"></header>
    <main class="container">
        <section class="card">
            <h2 class="page-title" th:text="${message}"></h2>
            <!-- Educational Note: Unsanitized user input can be exploited for XSS attacks. -->
            <p class="callout"><strong>Note:</strong> The comment you added may contain scripts that execute when viewing comments.</p>
            <div class="form-actions">
                <a class="btn" th:href="@{/comments}">View comments</a>
                <a class="btn btn-secondary" th:href="@{/addComment}">Add another</a>
            </div>
        </section>
    </main>
    <footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
