<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(title='Search Pictures')}">
    <title>Search Pictures</title>
</head>
<body>
    <header th:replace="~{fragments :: header(active='search')}"></header>
    <main class="container">
        <section class="card">
            <h2 class="page-title">Search Cat Pictures</h2>
            <!-- Vulnerability: SQL Injection - User input is directly concatenated into SQL queries. -->
            <p class="callout"><strong>Note:</strong> This search is vulnerable to SQL Injection attacks. Malicious SQL code can be injected via the name field.</p>
            <form action="#" th:action="@{/search}" method="post" class="form">
                <label class="field">
                    <span class="field-label">Name</span>
                    <input type="text" name="name" value="' OR '1'='1" />
                </label>
                <div class="form-actions">
                    <button type="submit" class="btn">Search</button>
                </div>
            </form>
        </section>
        <section class="card card-muted">
            <h3>Example Payload</h3>
            <ul class="plain-list">
                <li>Name: <code>' OR '1'='1</code></li>
            </ul>
        </section>
    </main>
    <footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
