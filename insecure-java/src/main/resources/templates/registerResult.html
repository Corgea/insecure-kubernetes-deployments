<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(title='Registration Result')}">
    <title>Registration Result</title>
</head>
<body>
    <header th:replace="~{fragments :: header(active='register')}"></header>
    <main class="container">
        <section class="card">
            <h2 class="page-title" th:text="${message}"></h2>
            <!-- Educational Note: Remember that passwords are stored in plaintext. -->
            <p class="callout"><strong>Note:</strong> Your password is stored in plaintext. This is insecure and demonstrates a common vulnerability.</p>
            <a class="btn" th:href="@{/login}">Continue to login</a>
        </section>
    </main>
    <footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
