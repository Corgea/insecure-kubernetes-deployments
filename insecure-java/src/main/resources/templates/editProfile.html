<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(title='Edit Profile')}">
    <title>Edit Profile</title>
</head>
<body>
    <header th:replace="~{fragments :: header(active='profile')}"></header>
    <main class="container">
        <section class="card">
            <h2 class="page-title">Edit Profile</h2>
            <!-- Vulnerability: IDOR - Users can edit profiles without authorization -->
            <p class="callout"><strong>Note:</strong> This page allows editing of user information without verifying ownership.</p>
            <form action="#" th:action="@{/editProfile}" method="post" class="form">
                <input type="hidden" name="userId" th:value="${user.id}" />
                <label class="field">
                    <span class="field-label">Username</span>
                    <input type="text" name="username" th:value="${user.username}" autocomplete="username" />
                </label>
                <label class="field">
                    <span class="field-label">Password</span>
                    <input type="password" name="password" autocomplete="new-password" />
                </label>
                <div class="form-actions">
                    <button type="submit" class="btn">Update Profile</button>
                    <a class="btn btn-secondary" th:href="@{/profile(userId=${user.id})}">Cancel</a>
                </div>
            </form>
        </section>
        <section class="card card-muted">
            <h3>Example Payload</h3>
            <ul class="plain-list">
                <li>Edit another user's profile by accessing the edit form with their <code>userId</code>, e.g., <code>?userId=2</code>.</li>
            </ul>
        </section>
    </main>
    <footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
