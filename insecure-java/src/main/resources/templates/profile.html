<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head(title='User Profile')}">
    <title>User Profile</title>
</head>
<body>
    <header th:replace="~{fragments :: header(active='profile')}"></header>
    <main class="container">
        <section class="card">
            <h2 class="page-title">User Profile</h2>
            <!-- Vulnerability: IDOR - No verification of user identity -->
            <p class="callout"><strong>Note:</strong> This page displays user information based on the provided user ID without verifying ownership.</p>
            <p class="callout callout-info" th:if="${message}" th:text="${message}"></p>
            <p>User ID: <span th:text="${user.id}"></span></p>
            <p>Username: <span th:text="${user.username}"></span></p>
            <a class="btn" th:href="@{'/editProfile'(userId=${user.id})}">Edit Profile</a>
        </section>
        <section class="card card-muted">
            <h3>Example Payload</h3>
            <ul class="plain-list">
                <li>Access another user's profile by changing the <code>userId</code> parameter in the URL, e.g., <code>?userId=2</code>.</li>
            </ul>
        </section>
    </main>
    <footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
