insecureJs:
  namespace: insecure-js
  appName: insecure-js
  containerName: insecure-js
  service:
    name: insecure-js
    port: 3000
    targetPort: 3000
  replicas: 1
  image:
    repository: confusedcrib/insecure-js
    tag: latest
  containerPort: 3000

insecureJava:
  namespace: insecure-java
  appName: insecure-java
  containerName: insecure-java
  service:
    name: insecure-java
    port: 8080
    targetPort: 8080
  replicas: 1
  image:
    repository: confusedcrib/insecure-java
    tag: latest
  containerPort: 8080
  
busybox:
  namespace: busybox
  replicas: 1
  image: busybox:1.35.0
  command: ["sleep", "3600"]

insecureApp:
  namespace: default
  appName: insecure-app
  replicas: 1
  image:
    repository: confusedcrib/insecure-app
    tag: latest
  ports:
    http: 8080
    ssh: 22

workloadSecurityEvaluator:
  namespace: default
  appName: workload-security-evaluator
  replicas: 1
  image:
    repository: confusedcrib/workload-security-evaluator
    tag: 1
  ports:
    http: 8080
    ssh: 22

insecureApi:
  namespace: insecure-api
  appName: insecure-api
  containerName: insecure-api
  service:
    name: insecure-api
    port: 8000
    targetPort: 8000
  replicas: 1
  image:
    repository: confusedcrib/insecure-api
    tag: latest
  containerPort: 8000

orders:
  namespace: orders
  appName: orders
  containerName: orders
  service:
    name: orders
    port: 80
    targetPort: 8000
  # Orders are held in memory by the service, so it runs as a single replica.
  replicas: 1
  image:
    repository: confusedcrib/insecure-api-orders
    tag: latest
  containerPort: 8000
  # Browser origins allowed to call the orders API (comma-separated), e.g. the storefront.
  allowedOrigins: ""
  # Secret with the fulfilment event token under the key `token`.
  eventTokenSecret: orders-event-token
  # From `terraform output`: registers the pods with the orders load balancer.
  targetGroupArn: ""
  lbSecurityGroupId: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 256Mi
